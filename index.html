<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cada Quetzal en su Lugar</title>
<meta name="description" content="Una forma sencilla de separar el dinero del negocio y el de la casa, en tres sobres.">
<meta name="theme-color" content="#F3EFE6">
<script>try{if(localStorage.getItem('cada-quetzal-tema')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<meta property="og:title" content="Cada Quetzal en su Lugar">
<meta property="og:description" content="El dinero del negocio y el de la casa, cada uno en su sobre.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="quetzal.svg" as="image">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cada Quetzal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: una columna tipo teléfono. Fondo claro por defecto y oscuro a elección; el color vive en los sobres (verde, amarillo, naranja) para que se reconozcan al instante */
:root{
  --bg:#F3EFE6; --surface:#FBF9F4; --surface-2:#ECE7DC; --line:#E0D9CB; --ink:#1E2721; --muted:#5D665F; --faint:#8C928B;
  --paper:#1F3A2E; --on-paper:#FBF9F4; --paper-muted:#AFC2B6;
  --verde:#3A9A66; --verde-soft:#E1EEE4; --amarillo:#E3AE36; --amarillo-soft:#F7ECCF; --naranja:#D4703F; --naranja-soft:#F5E1D6;
  --on-color:#14201A; --on-amarillo:#14201A; --brand:#1F3A2E; --on-brand:#FBF9F4;
  --sol:#E3AE36; --nube:#B9BDB3; --lluvia:#5E83A6; --alerta:#B3261E;
  --nav-bg:rgba(251,249,244,.96); --premio-bg:linear-gradient(140deg,#FBF9F4,#EFEADF); --shadow:0 1px 2px rgba(30,39,33,.06);
  --r0:#D9D3C4; --r1:#B8B09D; --r2:#8E8670; --r3:#5C5A48; --r4:#1F3A2E;
  --b200:#1E7F86; --b100:#8A5A2B; --b50:#C2740E; --b20:#2F5FA8; --b10:#B23A3A; --b5:#6B4AA0; --b1:#C9A227;
  --display:'Lexend','Segoe UI',Arial,sans-serif; --body:'Lexend','Segoe UI',Arial,sans-serif;
  --r-lg:26px; --r-md:16px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121813; --surface:#1A221C; --surface-2:#232D26; --line:#2D3830; --ink:#EEF0E8; --muted:#A3ACA3; --faint:#717A72;
  --paper:#EEF0E8; --on-paper:#142019; --paper-muted:#5A665E;
  --verde:#3FA66E; --verde-soft:#16271C; --amarillo:#E8B53E; --amarillo-soft:#2B2412; --naranja:#DB7444; --naranja-soft:#301B12;
  --brand:#EEF0E8; --on-brand:#142019;
  --sol:#EEF0E8; --nube:#8A928B; --lluvia:#BFCAD3; --alerta:#FF8A80;
  --nav-bg:rgba(18,24,19,.94); --premio-bg:linear-gradient(140deg,#232D26,#161D18); --shadow:none;
  --r0:#44504A; --r1:#6E7A72; --r2:#9AA59D; --r3:#C9D1CB; --r4:#EEF0E8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.shell{max-width:440px;margin:0 auto;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;margin:0;letter-spacing:-.02em;text-wrap:balance}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* encabezado */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.logo{width:30px;height:46px;flex:0 0 auto}
.logo img{width:100%;height:100%;display:block;object-fit:contain}
.brand{flex:1;min-width:0}
.brand b{display:block;font-weight:700;font-size:15px;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2}

main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;font-size:14px;color:var(--muted)}
.demo button{border:0;background:var(--paper);color:var(--on-paper);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.bell{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font-size:14px}
.bell svg{width:20px;height:20px;flex:0 0 auto;stroke:var(--ink);fill:none;stroke-width:2}
.bell small{display:block;color:var(--muted);font-size:12px}

/* tarjeta principal clara, como un cartel */
.hero{background:var(--paper);color:var(--on-paper);border:0;padding:24px 22px 22px}
.hero .label{color:var(--paper-muted)!important;opacity:1!important}
.hero h2{font-size:34px;color:var(--on-paper);margin-top:10px}
.hero p{color:var(--paper-muted);margin-top:8px}
.big-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-radius:99px;padding:8px 8px 8px 22px;font-family:var(--display);font-size:17px;font-weight:700;margin-top:18px;min-height:56px;text-align:left}
.big-btn::after{content:"→";width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.big-btn.go{background:var(--paper);color:var(--on-paper)}
.big-btn.go::after{background:var(--on-paper);color:var(--paper)}
.hero .big-btn.go{background:var(--on-paper);color:var(--paper)}
.hero .big-btn.go::after{background:var(--paper);color:var(--on-paper)}
.big-btn.plain{background:transparent;color:var(--ink);border:1px solid var(--line)}
.big-btn.plain::after{background:var(--surface-2);color:var(--ink)}
.big-btn.small{width:auto;min-height:0;padding:10px 18px;margin-top:0;font-size:15px;align-self:flex-start;flex:0 0 auto;justify-content:center}
.big-btn.small::after{display:none}
.big-btn:disabled{opacity:.4;cursor:not-allowed}
.split3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.split3 div{border-radius:14px;padding:10px 12px;font-size:12px;font-weight:700}
.split3 b{display:block;font-size:18px;font-weight:800}
.s-v{background:var(--verde);color:var(--on-color)} .s-a{background:var(--amarillo);color:var(--on-amarillo)} .s-n{background:var(--naranja);color:var(--on-color)}

/* acciones */
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;text-align:left;font-size:16px;font-weight:700;line-height:1.25;display:flex;flex-direction:column;gap:8px;letter-spacing:-.01em}
.act small{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.act .dot{width:26px;height:16px;border-radius:5px;margin:0}
.act.wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:14px}
.act.wide span.txt{display:flex;flex-direction:column;gap:2px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.day i{display:block;height:34px;border-radius:12px;margin-top:6px;border:1.5px dashed var(--line)}
.day.on i{border:0;background:var(--paper)}
.day.today{color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--paper)}
.bar.over i{background:var(--alerta)}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.note.bad{color:var(--alerta);font-weight:700}
.teaser{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.teaser svg{width:56px;height:56px;flex:0 0 auto}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:4px;align-self:center}

.metas{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.meta{display:flex;gap:12px;align-items:center;font-weight:700;font-size:15px}
.meta small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.tick{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;flex:0 0 auto;font-size:14px}
.meta.ok .tick{border:0;background:var(--paper);color:var(--on-paper)}

.debt{display:flex;flex-direction:column;gap:12px;border-left:5px solid var(--verde)}
.debt h3{font-size:20px;margin-top:4px}
.debt-inline{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:14px;text-align:left}

/* sobres */
.sobre{position:relative;border-radius:var(--r-lg);padding:22px 20px 18px;overflow:hidden}
.sobre::before{content:"";position:absolute;inset:0 0 auto 0;height:48px;clip-path:polygon(0 0,100% 0,50% 100%);background:rgba(255,255,255,.18)}
.sobre h3{font-size:18px;position:relative} .sobre p{position:relative;font-size:14px;margin-top:4px;opacity:.85}
.sobre .amt{font-weight:800;font-size:36px;margin-top:10px;position:relative;letter-spacing:-.02em}
.mov{display:flex;flex-direction:column}
.mov div{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.mov div:last-child{border-bottom:0}
.mov small{display:block;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.res div{background:var(--surface-2);border-radius:14px;padding:12px}
.res b{display:block;font-weight:800;font-size:20px}
.res b small,.ledger b small{font-size:13px;color:var(--muted);font-weight:700}
.ledger{display:flex;flex-direction:column;margin-top:10px}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--muted)}
.ledger div:last-child{border-bottom:0}
.ledger b{color:var(--ink);font-weight:700}
.ledger .tot{color:var(--ink);font-weight:800}
.ledger .tot b{font-size:20px;font-weight:800}

/* pronóstico */
.wx{text-align:center}
.wx svg{width:110px;height:110px;margin:0 auto;display:block}
.wx h2{font-size:34px;margin-top:4px}
.wx .sent{margin-top:10px;color:var(--muted)}
.wx .sent b{color:var(--ink)}
.cmp{margin-top:18px;display:flex;flex-direction:column;gap:10px;text-align:left}
.cmp .lane{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px;font-weight:700}
.cmp .lane span:nth-child(2){height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.cmp .lane i{display:block;height:100%;border-radius:99px}
.legend{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.legend div{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--muted)}
.legend svg{width:40px;height:40px;flex:0 0 auto}
.legend b{display:block;color:var(--ink);font-size:15px}

/* rango */
.rank{text-align:center}
.rank svg{width:160px;height:auto;display:block;margin:4px auto 8px}
.rank h2{font-size:28px;margin-top:6px}
.lvl{display:flex;justify-content:center;gap:6px;margin-top:12px}
.lvl i{width:30px;height:6px;border-radius:99px;background:var(--surface-2)} .lvl i.on{background:var(--paper)}
.premio{background:var(--premio-bg)}
.premio .big{font-weight:800;font-size:38px;margin-top:10px;letter-spacing:-.02em}
.premio .big small{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:0}
.pill{background:var(--paper);color:var(--on-paper);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:800}
.logros{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.logro{border-radius:16px;padding:12px;background:var(--surface-2);font-size:13px;color:var(--faint);border:1px solid transparent}
.logro b{display:block;font-size:14px;color:var(--muted)}
.logro.on{border-color:var(--ink);color:var(--muted)} .logro.on b{color:var(--ink)} .logro.on b::before{content:"✓ "}

/* menú inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--nav-bg);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs div{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
nav.tabs button{font-size:13px!important}
nav.tabs button{border:0;background:none;border-radius:99px;padding:8px 2px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
nav.tabs button[aria-current="page"]{color:var(--on-paper);background:var(--paper)}

/* hojas */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet-in>p{color:var(--muted)}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head h2{flex:1;font-size:24px}
.steps{display:flex;gap:6px} .steps i{flex:1;height:5px;border-radius:99px;background:var(--surface-2)} .steps i.on{background:var(--paper)}
.total{font-weight:800;font-size:52px;text-align:center;letter-spacing:-.03em}
.bills{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bill{position:relative;border:0;border-radius:14px;height:64px;color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.18)}
.bill small{font-size:13px;font-weight:800;background:rgba(0,0,0,.3);border-radius:99px;padding:2px 9px}
.bill.coin{border-radius:99px;color:#2A1F00}
.bill.coin small{background:rgba(255,255,255,.45)}
.minus{position:absolute;top:-8px;right:-6px;z-index:1;width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);font-size:18px;line-height:1;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border-radius:8px;padding:3px 8px;font-size:13px;font-weight:800;color:#fff}
.chip.coin{color:#2A1F00}
.place{border-radius:var(--r-lg);padding:18px}
.place .row h3{font-size:18px}
.place .amt{font-weight:800;font-size:28px}
.place .note{color:inherit;opacity:.75;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field>span{font-size:14px;font-weight:700}
.field input,.field select{font:inherit;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%}
.field small{color:var(--muted);font-size:13px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 15px;font-weight:700;font-size:14px}
.choice[aria-pressed="true"]{background:var(--paper);color:var(--on-paper);border-color:var(--paper)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button{border:2px solid transparent;border-radius:14px;padding:12px 4px;font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.warn{background:var(--surface-2);border-left:4px solid var(--alerta);border-radius:var(--r-md);padding:14px;font-size:14px;color:var(--muted)}
.warn b{display:block;font-size:15px;color:var(--ink)}
.warn .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.warn button{border:0;border-radius:99px;padding:9px 14px;font-weight:800;font-size:13px}
.warn .ok{background:var(--paper);color:var(--on-paper)} .warn .no{background:transparent;border:1px solid var(--ink)}
.info{background:var(--verde-soft);border-radius:var(--r-md);padding:14px;font-size:14px;color:var(--muted)}
.info b{display:block;font-size:15px;color:var(--ink)}
.info.n{background:var(--naranja-soft)}
.party{text-align:center;padding-top:24px}
.party .coins{height:90px;position:relative}
.party .coins span{position:absolute;bottom:0;width:38px;height:38px;border-radius:50%;animation:pop .9s ease-out both}
@keyframes pop{0%{transform:translateY(40px) scale(.4);opacity:0}60%{transform:translateY(-30px) scale(1.1);opacity:1}100%{transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion:reduce){.party .coins span{animation:none}}
.party h2{font-size:30px;margin-top:12px}
.up{background:var(--surface-2);border-radius:var(--r-lg);padding:18px;text-align:center}
.up svg{max-width:140px;margin:0 auto;display:block}
.loan-p{display:flex;flex-direction:column;gap:10px}
.loan-p b{font-size:22px;font-weight:800}
.loan-p small{color:var(--muted);font-size:13px}
.dev-row{display:flex;gap:10px;align-items:flex-end}
.dev-row .field{flex:1}
.dev-row .big-btn{align-self:flex-end;padding:13px 18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--paper);color:var(--on-paper);border-radius:14px;padding:11px 16px;font-size:14px;font-weight:700;max-width:calc(100% - 32px)}
.credit{font-size:12px;color:var(--faint);text-align:center;padding:8px 8px 0;line-height:1.5}
.install{display:flex;gap:12px;align-items:flex-start}
.install svg{width:28px;height:28px;flex:0 0 auto;stroke:var(--ink);fill:none;stroke-width:2}

/* versión sencilla: sobres a la vista, un botón para sacar dinero y ayudas */
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini{border:0;border-radius:16px;padding:14px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:700;min-height:84px;position:relative;overflow:hidden}
.mini::before{content:"";position:absolute;inset:0 0 auto 0;height:26px;clip-path:polygon(0 0,100% 0,50% 100%);background:rgba(255,255,255,.22)}
.mini span,.mini b{position:relative}
.mini b{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:auto}
.help{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:800;font-size:15px;display:inline-grid;place-items:center;flex:0 0 auto;padding:0}
.row.c{align-items:center}
.sac{min-height:76px;padding:16px 18px;box-shadow:var(--shadow)}
.sac .txt{font-size:18px}
.sac .ico{width:46px;height:46px;border-radius:50%;background:var(--paper);color:var(--on-paper);display:grid;place-items:center;font-size:17px;font-weight:800;flex:0 0 auto}
.sac::after{content:"→";margin-left:auto;font-size:20px}
.picks{display:flex;flex-direction:column;gap:12px}
.pick{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.pick i{width:14px;align-self:stretch;border-radius:8px;flex:0 0 auto}
.pick b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em}
.pick small{display:block;font-size:14px;color:var(--muted);margin-top:2px;line-height:1.4}
.back{border:0;background:none;padding:6px 0;font-weight:700;color:var(--muted);align-self:flex-start}
.intro{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:12px}
.intro .logo{width:110px;height:172px}
.intro h2{font-size:30px}
.intro p{color:var(--muted);font-size:17px;max-width:340px}
.intro .env{width:100%;border-radius:var(--r-lg);padding:30px 22px 24px;text-align:left;position:relative;overflow:hidden}
.intro .env::before{content:"";position:absolute;inset:0 0 auto 0;height:64px;clip-path:polygon(0 0,100% 0,50% 100%);background:rgba(255,255,255,.22)}
.intro .env span{position:relative;display:block;font-size:14px;font-weight:800;opacity:.8}
.intro .env b{position:relative;display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:28px}
.intro .env p{position:relative;color:inherit;opacity:.9;margin-top:6px;font-size:16px;max-width:none}
.skip{border:0;background:none;color:var(--muted);font-weight:700;padding:6px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
details.more{border:1px solid var(--line);border-radius:var(--r-md);padding:4px 14px;background:var(--surface)}
details.more summary{cursor:pointer;font-weight:800;padding:10px 0;list-style:none}
details.more summary::after{content:" +";color:var(--muted)}
details.more[open] summary::after{content:" -"}
details.more .field{margin-bottom:14px}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.overlay .card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px;margin-bottom:env(safe-area-inset-bottom,0px)}
.overlay p{color:var(--muted);font-size:16px}

/* pantallas grandes: titular grande al lado de la app */
.side{display:none}
@media (min-width:980px){
  .side{display:flex;flex-direction:column;gap:24px;position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:calc(50% - 520px);width:460px}
  .side .logo{width:92px;height:144px}
  .side .slogan{font-size:22px;font-weight:700;color:var(--ink);line-height:1.35;letter-spacing:-.01em}
  .side h1{font-size:68px;line-height:.98;letter-spacing:-.04em}
  .side p{font-size:17px;color:var(--muted);line-height:1.6}
  .side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  .side li{display:flex;gap:14px;align-items:center;font-weight:700}
  .side li i{width:34px;height:22px;border-radius:6px;flex:0 0 auto}
  .side .credit{text-align:left;padding:0;font-size:13px}
  .shell{margin-left:calc(50% + 20px);margin-right:0}
  .overlay{align-items:center}
  nav.tabs{left:calc(50% + 20px);right:auto;width:440px;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding-left:8px;padding-right:8px}
  .toast{left:calc(50% + 240px)}
  .tabs-credit{display:none}
}
</style>

<body>

<script>
(function(){
'use strict';
var KEY='cada-quetzal-v1';
var DEN=[200,100,50,20,10,5,1];
var BILLCOLOR={200:'var(--b200)',100:'var(--b100)',50:'var(--b50)',20:'var(--b20)',10:'var(--b10)',5:'var(--b5)',1:'var(--b1)'};
var MOTIVOS=[
  {id:'comida',label:'Comida de la casa',sobre:'amarillo'},
  {id:'servicios',label:'Luz, agua o renta',sobre:'amarillo'},
  {id:'estudios',label:'Estudios',sobre:'amarillo'},
  {id:'cuota',label:'Pago de préstamo',sobre:'naranja'},
  {id:'salud',label:'Salud',sobre:'naranja'},
  {id:'emergencia',label:'Emergencia',sobre:'naranja'},
  {id:'otro',label:'Otro gasto',sobre:'amarillo'}
];
var SOBRE={verde:{name:'Sobre verde',rule:'Vuelve al negocio: mercadería, proveedores, gasolina y sueldos de sus trabajadores. No se toca para la casa.',cls:'s-v'},
  amarillo:{name:'Sobre amarillo',rule:'Para usted: lo que se lleva para su casa.',cls:'s-a'},
  naranja:{name:'Sobre naranja',rule:'Apartado: para pagar préstamos y cubrir emergencias.',cls:'s-n'}};
var RANGOS=[{n:'Emprendedor Semilla',min:0},{n:'Emprendedor en Marcha',min:3},{n:'Emprendedor Constante',min:9},{n:'Emprendedor Ordenado',min:20},{n:'Emprendedor Maestro',min:45}];
var PTS_CIERRE=10, PTS_META=30;

/* ---------- fechas ---------- */
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function add(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ds(d)}
function diff(a,b){return Math.round((parse(b)-parse(a))/86400000)}
var TODAY=ds(new Date());
var DIAS=['Do','Lu','Ma','Mi','Ju','Vi','Sá'];
function fmtDay(s){var d=parse(s);var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return d.getDate()+' '+m[d.getMonth()]}
function Q(n){return 'Q'+Math.round(n).toLocaleString('es-GT')}
function lunes(s){var d=parse(s).getDay();return add(s,-((d+6)%7))}

/* ---------- reparto ---------- */
function expand(counts){var a=[];DEN.forEach(function(d){for(var i=0;i<(counts[d]||0);i++)a.push(d)});return a}
function group(list){var c={};list.forEach(function(d){c[d]=(c[d]||0)+1});return DEN.filter(function(d){return c[d]}).map(function(d){return {d:d,n:c[d]}})}
function sum(a){return a.reduce(function(s,x){return s+x},0)}
function apartadoDia(setup){return Math.round((setup.cuotaMes||0)/30+(setup.ahorroDia||0))}
function repartir(total,counts,setup){
  var tV=Math.round(total*setup.pctReponer/100), tN=Math.min(apartadoDia(setup),Math.max(0,total-tV));
  var pool=expand(counts||{});
  if(!pool.length) return {verde:tV,naranja:tN,amarillo:total-tV-tN,bills:null};
  function take(target){var got=[],rem=target;for(var i=0;i<pool.length;){if(pool[i]<=rem){rem-=pool[i];got.push(pool.splice(i,1)[0])}else i++}return got}
  var bv=take(tV), bn=take(tN), ba=pool;
  return {verde:sum(bv),naranja:sum(bn),amarillo:sum(ba),bills:{verde:group(bv),naranja:group(bn),amarillo:group(ba)}};
}
function billsFor(total){
  var c={},rem=total,caps={200:0,100:2,50:3,20:6,10:8,5:10,1:99};
  DEN.forEach(function(d){var n=Math.min(Math.floor(rem/d),caps[d]);if(n>0){c[d]=n;rem-=n*d}});
  return c;
}

/* ---------- estado ---------- */
function defaultsSetup(){return {negocio:'Comedor La Esquina',pctReponer:50,cuotaMes:1500,ahorroDia:10,metaUsted:4000,alarma:'19:00'}}
function demoState(){
  var s={v:6,demo:true,setup:defaultsSetup(),cierres:[],retiros:[],maxRacha:6};
  var plan=[[-20,450],[-19,390],[-18,430],[-16,470],[-15,410],[-9,410],[-8,365],[-6,480],[-5,395],[-4,520],[-3,440],[-2,375],[-1,505]];
  plan.forEach(function(p){var f=add(TODAY,p[0]);var r=repartir(p[1],billsFor(p[1]),s.setup);
    s.cierres.push({fecha:f,total:p[1],verde:r.verde,amarillo:r.amarillo,naranja:r.naranja})});
  var R=function(d,m,tipo,mot,sobre,dev){var o={fecha:add(TODAY,d),monto:m,tipo:tipo,motivo:mot||null,sobre:sobre};if(tipo==='prestamo'){o.devuelto=dev==null?null:add(TODAY,dev);o.pagos=dev==null?[]:[{fecha:add(TODAY,dev),monto:m}]}s.retiros.push(o)};
  R(-8,60,'casa','comida','amarillo');
  R(-6,600,'compra',null,'verde');
  R(-4,700,'compra',null,'verde');
  R(-5,150,'casa','servicios','amarillo');
  R(-4,300,'prestamo','otro','verde',-3);
  R(-3,80,'casa','salud','naranja');
  R(-2,100,'casa','estudios','amarillo');
  R(-2,250,'prestamo','comida','verde',null);
  R(-1,500,'compra',null,'verde');
  R(-1,70,'casa','comida','amarillo');
  var a=add(TODAY,-9), u9=ventasEntre(s,a,TODAY)-comprasEntre(s,a,TODAY)-sum(entre(s.cierres,a,TODAY).map(function(c){return c.naranja}));
  s.setup.metaUsted=Math.max(500,Math.round(u9/9*30*1.15/100)*100);
  return s;
}
function migrate(s){
  if(!s.v||s.v<3){
    s.retiros.forEach(function(r){
      if(r.tipo) return;
      if(r.motivo==='mercaderia'){r.tipo='compra';r.motivo=null;r.sobre='verde'}
      else if(r.sobre==='verde'){r.tipo='prestamo';r.devuelto=null}
      else r.tipo='casa';
    });
    s.v=3;
  }
  if(s.v<4){
    s.retiros.forEach(function(r){if(r.tipo==='prestamo'&&!r.pagos)r.pagos=r.devuelto?[{fecha:r.devuelto,monto:r.monto}]:[]});
    s.v=4;
  }
  if(s.v<5){
    if(s.setup.metaGanancia==null)s.setup.metaGanancia=(s.setup.sueldoSemana||700)*4;
    delete s.setup.sueldoSemana;
    s.v=5;
  }
  if(s.v<6){
    var st=s.setup, n=s.cierres.length, prom=n?sum(s.cierres.map(function(c){return c.total}))/n:0;
    if(st.ahorroDia==null) st.ahorroDia=Math.round(prom*(st.pctColchon||0)/100);
    if(st.cuotaMes==null) st.cuotaMes=0;
    if(st.metaUsted==null) st.metaUsted=st.metaGanancia||3000;
    delete st.pctColchon; delete st.metaMes; delete st.metaGanancia;
    s.v=6;
  }
  return s;
}
function load(){try{var t=localStorage.getItem(KEY);if(t){var s=JSON.parse(t);if(s&&s.setup&&s.cierres)return migrate(s)}}catch(e){}return null}
var S=load()||demoState();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- cálculos ---------- */
function closedOn(s,f){return s.cierres.some(function(c){return c.fecha===f})}
function racha(s){var d=closedOn(s,TODAY)?TODAY:add(TODAY,-1),n=0;while(closedOn(s,d)){n++;d=add(d,-1)}return n}
function rango(n){var i=0;RANGOS.forEach(function(l,k){if(n>=l.min)i=k});return i}
function motivo(id){return MOTIVOS.filter(function(m){return m.id===id})[0]||MOTIVOS[MOTIVOS.length-1]}
function pagado(r){return sum((r.pagos||[]).map(function(p){return p.monto}))}
function resta(r){return Math.max(0,r.monto-pagado(r))}
function pendientes(s){return s.retiros.filter(function(r){return r.tipo==='prestamo'&&resta(r)>0})}
function deuda(s){return sum(pendientes(s).map(resta))}
function balances(s){var b={verde:0,amarillo:0,naranja:0};
  s.cierres.forEach(function(c){b.verde+=c.verde;b.amarillo+=c.amarillo;b.naranja+=c.naranja});
  s.retiros.forEach(function(r){
    if(r.tipo==='compra') b.verde-=r.monto;
    else if(r.tipo==='prestamo') { b.verde-=resta(r); b.amarillo-=pagado(r); }
    else b[r.sobre]-=r.monto;
  });return b}
function forecast(s,o){
  o=o||{};var from=add(TODAY,-13);
  var cs=s.cierres.filter(function(c){return c.fecha>=from});
  if(!cs.length) return null;
  var first=cs.map(function(c){return c.fecha}).sort()[0];
  var last=closedOn(s,TODAY)?TODAY:add(TODAY,-1);
  var span=Math.max(1,diff(first,last)+1);
  var verdeIn=sum(cs.map(function(c){return c.verde}));
  var bad=sum(s.retiros.filter(function(r){return r.fecha>=from&&r.tipo==='prestamo'}).map(resta));
  var monthly=Math.max(0,(verdeIn-(o.sinDeuda?0:bad))/span*30);
  /* compras estimadas con lo anotado en los últimos 30 días */
  var cFrom=add(TODAY,-29), compras=s.retiros.filter(function(r){return r.tipo==='compra'&&r.fecha>=cFrom});
  if(!compras.length) return {sinCompras:true,monthly:monthly,span:span,bad:bad};
  var cFirst=[first].concat(compras.map(function(r){return r.fecha})).sort()[0];
  var cSpan=Math.max(7,diff(cFirst<cFrom?cFrom:cFirst,TODAY)+1);
  var meta=Math.max(1,sum(compras.map(function(r){return r.monto}))/cSpan*30), ratio=monthly/meta;
  var status=ratio>=1?'sol':ratio>=0.85?'nube':'lluvia';
  return {monthly:monthly,meta:meta,ratio:ratio,status:status,span:span,bad:bad,cdias:cSpan};
}
/* gasto de la casa: su parte (amarillo) y préstamos del verde; el apartado no cuenta */
function casaEntre(s,a,b){return sum(s.retiros.filter(function(r){return r.fecha>=a&&r.fecha<=b&&(r.tipo==='prestamo'||(r.tipo==='casa'&&r.sobre==='amarillo'))}).map(function(r){return r.monto}))}
function entre(list,a,b){return list.filter(function(x){return x.fecha>=a&&x.fecha<=b})}
function ventasEntre(s,a,b){return sum(entre(s.cierres,a,b).map(function(c){return c.total}))}
function parteEntre(s,a,b){return sum(entre(s.cierres,a,b).map(function(c){return c.amarillo}))}
function comprasEntre(s,a,b){return sum(entre(s.retiros,a,b).filter(function(r){return r.tipo==='compra'}).map(function(r){return r.monto}))}
function pct(a,b){return b>0?Math.round(a/b*100):0}
function metasSemana(s,ini){
  var fin=add(ini,6);
  var cierres=s.cierres.filter(function(c){return c.fecha>=ini&&c.fecha<=fin}).length;
  var casa=casaEntre(s,ini,fin);
  var hasta=fin<TODAY?fin:TODAY;
  var sinDeuda=!s.retiros.some(function(r){return r.tipo==='prestamo'&&r.fecha<=hasta&&(!r.devuelto||r.devuelto>hasta)});
  var m=[
    {t:'Cierre la caja 5 días',ok:cierres>=5,p:Math.min(cierres,5)+' de 5'},
    {t:'No saque más de su parte',ok:casa<=parteEntre(s,ini,fin),p:Q(casa)+' de '+Q(parteEntre(s,ini,fin))},
    {t:'Sin deudas con el sobre verde',ok:sinDeuda,p:sinDeuda?'Al día':'Debe '+Q(deuda(s))}
  ];
  return {metas:m,cumplidas:m.filter(function(x){return x.ok}).length};
}
function semanasCerradas(s){
  if(!s.cierres.length) return [];
  var first=lunes(s.cierres.map(function(c){return c.fecha}).sort()[0]), out=[], w=first, actual=lunes(TODAY);
  while(w<actual){out.push({ini:w,r:metasSemana(s,w)});w=add(w,7)}
  return out;
}
function puntosMes(s){
  var mes=TODAY.slice(0,7);
  var pc=s.cierres.filter(function(c){return c.fecha.slice(0,7)===mes}).length*PTS_CIERRE;
  var pm=sum(semanasCerradas(s).filter(function(w){return add(w.ini,6).slice(0,7)===mes}).map(function(w){return w.r.cumplidas*PTS_META}));
  return pc+pm;
}
var WX={sol:{t:'Despejado',s:'Le alcanza para los gastos del negocio.'},nube:{t:'Nublado',s:'Va justo. Cuide el sobre verde.'},lluvia:{t:'Lluvia',s:'Así no le va a alcanzar para los gastos del negocio.'}};

/* ---------- dibujos ---------- */
function wxSVG(st){
  var sun='<circle cx="46" cy="44" r="20" style="fill:var(--sol)"/>'+[0,45,90,135,180,225,270,315].map(function(a){var r=a*Math.PI/180;return '<line x1="'+(46+28*Math.cos(r)).toFixed(1)+'" y1="'+(44+28*Math.sin(r)).toFixed(1)+'" x2="'+(46+36*Math.cos(r)).toFixed(1)+'" y2="'+(44+36*Math.sin(r)).toFixed(1)+'" style="stroke:var(--sol);stroke-width:5;stroke-linecap:round"/>'}).join('');
  var cloud='<path d="M38 92h50a18 18 0 0 0 0-36 26 26 0 0 0-50 6 15 15 0 0 0 0 30z" style="fill:var(--nube)"/>';
  if(st==='sol') return '<svg viewBox="0 0 120 120" aria-hidden="true"><g transform="translate(14 16)">'+sun+'</g></svg>';
  if(st==='nube') return '<svg viewBox="0 0 120 120" aria-hidden="true">'+sun+cloud+'</svg>';
  return '<svg viewBox="0 0 120 120" aria-hidden="true">'+cloud.replace('var(--nube)','var(--muted)')+[44,62,80].map(function(x){return '<line x1="'+x+'" y1="100" x2="'+(x-6)+'" y2="114" style="stroke:var(--lluvia);stroke-width:5;stroke-linecap:round"/>'}).join('')+'</svg>';
}
function rankSVG(i){
  var col='var(--r'+i+')';
  return '<svg viewBox="0 0 200 170" role="img" aria-label="'+RANGOS[i].n+'">'
    +'<path d="M62 92l-14 70 26-12 14 20 12-60z" style="fill:var(--faint)"/><path d="M138 92l14 70-26-12-14 20-12-60z" style="fill:var(--faint)"/>'
    +'<circle cx="100" cy="70" r="62" style="fill:'+col+'"/><circle cx="100" cy="70" r="48" style="fill:var(--surface)"/>'
    +'<text x="100" y="88" text-anchor="middle" style="fill:var(--ink);font:600 52px var(--display)">'+(i+1)+'</text></svg>';
}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function chipsHTML(list){if(!list||!list.length)return '<span class="note">Sin billetes</span>';
  return list.map(function(b){return '<span class="chip'+(b.d===1?' coin':'')+'" style="background:'+BILLCOLOR[b.d]+'">'+b.n+' × Q'+b.d+'</span>'}).join('')}

/* ---------- ayudas ---------- */
var HELP={

function debtCard(){
  var d=deuda(S); if(!d) return '';
  return '<section class="card debt"><div><span class="label">Préstamo pendiente</span><h3>Le debe '+Q(d)+' al sobre verde</h3><p class="note" style="margin-top:4px">Lo tomó para la casa. Cuando lo reponga en el sobre, toque Devolví y su pronóstico se limpia.</p></div><button class="big-btn go small" id="btn-devolver">Devolví</button></section>';
}

  h+=debtCard();

  if(f&&!f.sinCompras) h+='<section class="card"><div class="row c"><button class="teaser" data-go="pronostico" style="border:0;background:none;padding:0">'+wxSVG(f.status)+'<span><span class="label">Su dinero a fin de mes</span><b style="display:block;font-family:var(--display);font-size:20px;font-weight:700">'+WX[f.status].t+'</b><span class="note" style="margin:0">'+WX[f.status].s+'</span></span></button>'+helpBtn('pron')+'</div></section>';
  h+='<section class="card"><div class="row c"><h3>Reto de 7 días</h3>'+helpBtn('reto')+'</div><div class="week">';

  h+='<section class="card"><div class="row c"><h3>Lo que sacó para la casa</h3>'+helpBtn('casa')+'</div><p class="num" style="margin-top:6px"><b style="font-size:24px;font-weight:800">'+Q(casa)+'</b> de su parte de '+Q(parte)+' esta semana</p><div class="bar'+(over?' over':'')+'"><i style="width:'+bp+'%"></i></div><p class="note'+(over?' bad':'')+'">'+(over?'Se pasó por '+Q(casa-parte)+'. Eso salió del dinero del negocio o del apartado.':'Le quedan '+Q(parte-casa)+' de su parte esta semana.')+'</p></section>';
  h+='<button class="big-btn plain" data-go="pronostico" style="margin:0">Ver el pronóstico de fin de mes</button>';
  var from=add(TODAY,-29), cs=S.cierres.filter(function(c){return c.fecha>=from});
  var compras=sum(S.retiros.filter(function(r){return r.fecha>=from&&r.tipo==='compra'}).map(function(r){return r.monto}));
  var ven=sum(cs.map(function(c){return c.total})), gan=ven-compras;
  h+='<section class="card"><h3>Resumen de 30 días</h3><div class="res num"><div><span class="label">Vendió</span><b>'+Q(ven)+'</b></div><div><span class="label">Gastos del negocio</span><b>'+Q(compras)+'</b></div><div><span class="label">Ganancia</span><b>'+Q(gan)+' <small>'+pct(gan,ven)+'%</small></b></div><div><span class="label">Para usted</span><b>'+Q(sum(cs.map(function(c){return c.amarillo})))+'</b></div></div><p class="note">Al empezar otro mes no se borra nada: sus sobres siguen con lo que tienen. Este historial también sirve para demostrar sus ingresos si algún día pide un crédito.</p></section>';

function lane(label,val,max,color){return '<div class="lane num"><span>'+label+'</span><span><i style="width:'+Math.min(100,val/Math.max(1,max)*100).toFixed(1)+'%;background:'+color+'"></i></span><span>'+Q(val)+'</span></div>'}
function renderPronostico(){var bk='<button class="back" data-go="hoy">← Volver</button>';return bk+renderPron()}
function renderPron(){
  var f=forecast(S,{});
  if(!f) return '<section class="card"><h3>Todavía no hay pronóstico</h3><p class="note">Cierre la caja unos días y aquí verá si le alcanza para los gastos del negocio a fin de mes.</p></section>';
  if(f.sinCompras) return '<section class="card"><h3>Falta un dato</h3><p class="note">Anote los gastos del negocio con el botón Saqué dinero. Con unos días de datos, la app calcula sola cuánto gasta al mes y si le va a alcanzar.</p></section>';
  var dim=new Date(parse(TODAY).getFullYear(),parse(TODAY).getMonth()+1,0).getDate(), left=dim-parse(TODAY).getDate();
  var max=Math.max(f.monthly,f.meta);

  h+='<div class="cmp">'+lane('Va a juntar',f.monthly,max,'var(--paper)')+lane('Gasta',f.meta,max,'var(--faint)')+'</div>';
  if(f.bad>0) h+='<div class="debt-inline"><p class="note bad" style="margin:0">Lo que baja su pronóstico: debe '+Q(f.bad)+' al sobre verde.</p><button class="big-btn go small" id="btn-devolver">Devolví</button></div>';
  h+='<p class="note" style="text-align:left">Faltan '+left+' días para fin de mes. Al empezar otro mes no se borra nada.</p></section>';
  h+='<section class="card"><h3>Cómo leer el pronóstico</h3><div class="legend">'
    +'<div>'+wxSVG('sol')+'<span><b>Despejado</b>Le alcanza para los gastos del negocio.</span></div>'
    +'<div>'+wxSVG('nube')+'<span><b>Nublado</b>Va justo. Cuide el sobre verde.</span></div>'
    +'<div>'+wxSVG('lluvia')+'<span><b>Lluvia</b>No le va a alcanzar si sigue así.</span></div></div></section>';

function renderPuesto(){
  var n=S.cierres.length, i=rango(n), next=RANGOS[i+1], b=balances(S), sem=semanasCerradas(S);
  var perfectas=sem.filter(function(w){return w.r.cumplidas===3}).length;

  var from=add(TODAY,-6);
  var verdeLimpio=!S.retiros.some(function(x){return x.fecha>=from&&x.tipo==='prestamo'})&&S.cierres.filter(function(c){return c.fecha>=from}).length>=5;
  var ms=metasSemana(S,lunes(TODAY));

  h+='<p class="note">'+(next?'Le faltan '+(next.min-n)+' cierres de caja para ser '+next.n+'.':'Llegó al rango más alto.')+'</p></section>';

    ['Apartado de Q200','Su sobre naranja llegó a Q200.',b.naranja>=200],
    ['Apartado de Q500','Su sobre naranja llegó a Q500.',b.naranja>=500],
    ['15 cierres','Medio mes cerrando la caja.',n>=15],
    ['30 cierres','Un mes completo de cierres.',n>=30],
    ['60 cierres','Dos meses de constancia.',n>=60]
  ];

var root=document.getElementById('sheet-root');

    h+='<p class="note">Su regla: Q'+S.setup.pctReponer+' de cada Q100 al negocio'+(apartadoDia(S.setup)?' y '+Q(apartadoDia(S.setup))+' al día al apartado':'')+'. El resto es para usted.</p><button class="big-btn go" id="btn-listo">Ya los puse en su lugar</button>';
  } else {
    h=head('',3,3)+'<div class="party"><div class="coins" aria-hidden="true">'+['var(--verde)','var(--amarillo)','var(--naranja)','var(--amarillo)','var(--verde)'].map(function(col,k){return '<span style="left:calc(50% - 19px + '+((k-2)*44)+'px);background:'+col+';animation-delay:'+(k*0.08)+'s"></span>'}).join('')+'</div><h2>'+esc(c.frase)+'</h2><p class="note">Racha: '+c.racha+(c.racha===1?' día':' días')+', +'+PTS_CIERRE+' puntos</p></div>';
    if(c.subio) h+='<section class="up">'+rankSVG(c.rango)+'<p class="label">¡Subió de rango!</p><h3 style="font-size:22px">Ahora es '+RANGOS[c.rango].n+'</h3></section>';
    if(c.reto) h+='<section class="card" style="background:var(--verde-soft);border:0"><h3>Reto de 7 días cumplido</h3><p class="note">Siete días seguidos separando el dinero. Esa es la regla que hace la diferencia.</p></section>';
    h+='<button class="big-btn go" data-close>Listo</button>';
  }
  openSheet(h,'c'+c.step);
}
function frase(r){if(r>=8)return '¡Cabal! '+r+' días seguidos, ya es costumbre.';if(r===7)return '¡Reto de 7 días cumplido! Bien chispudo.';if(r>=4)return '¡Qué chilero! '+r+' días seguidos.';if(r>=2)return '¡A la gran! Lleva '+r+' días seguidos.';return '¡Va pues! Cada quetzal quedó en su lugar.'}

function amountBlock(M){
  return '<div class="total num" id="mov-total">'+Q(movTotal(M))+'</div>'+(M.typing?'<div class="field"><label for="m-typed">Monto</label><input id="m-typed" type="number" inputmode="numeric" min="0" placeholder="Ej. 400" value="'+esc(M.typed)+'"></div><button class="link" id="m-to-bills">Mejor toco billetes</button>'
    :billGrid(M.counts,'mden')+'<button class="link" id="m-to-typed">Prefiero escribir el monto</button>');
}
function movTotal(M){return M.typing?(+M.typed||0):countsTotal(M.counts)}
function renderSaque(){
  var pk=function(id,cls,t,s){return '<button class="pick" id="'+id+'"><i class="'+cls+'"></i><span><b>'+t+'</b><small>'+s+'</small></span></button>'};
  openSheet(head('Saqué dinero',0,0)+'<p>¿Para qué fue?</p><div class="picks">'
    +pk('btn-compra','s-v','Gastos del negocio','Mercadería, proveedores, gasolina o sueldos de trabajadores. Sale del sobre verde.')
    +pk('btn-casa','s-a','Para la casa','Comida, luz, agua o estudios. Sale de su parte, el sobre amarillo.')
    +pk('btn-emerg','s-n','Préstamo o emergencia','La cuota del préstamo, salud o una emergencia. Sale del apartado, el sobre naranja.')
    +'</div>','s');
}
function renderMov(){
  var M=mov, t=movTotal(M), b=balances(S), h='';
  if(M.kind==='compra'){
    h=head('Gastos del negocio',0,0)+'<p>Mercadería, proveedores, gasolina o sueldos de sus trabajadores. Sale del sobre verde: para eso está.</p>'+amountBlock(M);
    if(t>b.verde) h+='<div class="warn"><b>El sobre verde tiene '+Q(b.verde)+'</b>Puede anotarlo igual. Si pagó con otro dinero, recuerde reponerlo.</div>';
    h+='<button class="big-btn go" id="m-anotar"'+(t>0?'':' disabled')+'>Anotar gasto</button><p class="note" style="text-align:center">El sobre verde tiene '+Q(b.verde)+'.</p>';
  } else if(M.emerg){
    h=head('Saqué del apartado',0,0)+'<p>Para pagar un préstamo o cubrir una emergencia. Sale del sobre naranja y no toca su parte ni el dinero del negocio.</p>'+amountBlock(M);
    h+='<div class="field"><span>¿Pago de préstamo o emergencia?</span><div class="choices">'+MOTIVOS.filter(function(x){return ['cuota','salud','emergencia'].indexOf(x.id)>-1}).map(function(x){return '<button class="choice" data-motivo="'+x.id+'" aria-pressed="'+(x.id===M.motivo)+'">'+x.label+'</button>'}).join('')+'</div></div>';
    if(t>0&&t>b.naranja) h+='<div class="warn"><b>Su apartado tiene '+Q(Math.max(0,b.naranja))+'</b>Si no le alcanza, puede tomar lo que falte como préstamo del sobre verde y devolverlo después.<div class="acts"><button class="ok" data-sobre="verde">Tomarlo como préstamo</button></div></div>';
    h+='<button class="big-btn go" id="m-anotar"'+(t>0?'':' disabled')+'>Anotar</button><p class="note" style="text-align:center">Su apartado tiene '+Q(b.naranja)+'.</p>';
  } else {
    var ini=lunes(TODAY), casa=casaEntre(S,ini,TODAY), parte=parteEntre(S,ini,TODAY);
    h=head('Saqué para la casa',0,0)+amountBlock(M);
    h+='<div class="field"><span>¿Para qué fue?</span><div class="choices">'+MOTIVOS.filter(function(x){return ['comida','servicios','estudios','otro'].indexOf(x.id)>-1}).map(function(x){return '<button class="choice" data-motivo="'+x.id+'" aria-pressed="'+(x.id===M.motivo)+'">'+x.label+'</button>'}).join('')+'</div></div>';
    h+='<div class="field"><span>¿De dónde lo sacó?</span><div class="seg">'
      +'<button class="s-a" data-sobre="amarillo" aria-pressed="'+(M.sobre==='amarillo')+'">De mi parte</button>'
      +'<button class="s-v" data-sobre="verde" aria-pressed="'+(M.sobre==='verde')+'">Prestado del verde</button></div></div>';
    if(M.sobre==='verde') h+='<div class="info"><b>Queda anotado como préstamo del sobre verde</b>Su pronóstico baja hasta que lo reponga. Cuando lo devuelva, toque Devolví en la pantalla Hoy.</div>';
    else if(t>0&&t>b.amarillo) h+='<div class="warn"><b>Su parte tiene '+Q(Math.max(0,b.amarillo))+'</b>Si no le alcanza, puede tomarlo como préstamo del sobre verde y devolverlo después.<div class="acts"><button class="ok" data-sobre="verde">Tomarlo como préstamo</button></div></div>';
    else if(t>0&&casa+t>parte) h+='<div class="warn"><b>Se pasa de su parte de la semana</b>Con esto lleva '+Q(casa+t)+' de '+Q(parte)+'.</div>';
    h+='<button class="big-btn go" id="m-anotar"'+(t>0?'':' disabled')+'>'+(M.sobre==='verde'?'Anotar préstamo':'Anotar')+'</button>';
    if(M.sobre!=='verde') h+='<p class="note" style="text-align:center">Su parte tiene '+Q(b.amarillo)+'.</p>';
  }
  openSheet(h,'m');
}
function renderDevolver(){
  var p=pendientes(S), h=head('Devolví al sobre verde',0,0);
  h+='<p>Anote cuánto puso de vuelta en el sobre verde. Puede devolver solo una parte; lo que falte queda pendiente. Se descuenta de su sobre amarillo.</p>';
  if(!p.length) h+='<p class="note">No tiene préstamos pendientes.</p>';
  p.forEach(function(r){var i=S.retiros.indexOf(r),rs=resta(r),pg=pagado(r);
    h+='<section class="card loan-p"><div class="row"><b class="num">Falta '+Q(rs)+'</b><small>'+fmtDay(r.fecha)+', '+motivo(r.motivo).label+'</small></div>'+(pg>0?'<p class="note" style="margin:0">Prestó '+Q(r.monto)+' y ya devolvió '+Q(pg)+'.</p>':'')
      +'<div class="dev-row"><div class="field"><label for="dev-'+i+'">¿Cuánto devolvió?</label><input id="dev-'+i+'" type="number" inputmode="numeric" min="1" max="'+rs+'" value="'+rs+'"></div><button class="big-btn go small" data-devolver="'+i+'">Devolví</button></div></section>'});
  if(p.length>1) h+='<button class="big-btn plain" id="dev-todo">Devolví todo ('+Q(deuda(S))+')</button>';
  openSheet(h,'d');
}
function pagar(r,amt){amt=Math.min(Math.round(amt),resta(r));if(amt<=0)return 0;r.pagos=r.pagos||[];r.pagos.push({fecha:TODAY,monto:amt});if(resta(r)===0)r.devuelto=TODAY;return amt}

/* ---------- bienvenida ---------- */
var INTRO_KEY='cada-quetzal-intro', intro=0;
var INTRO=[
  '<div class="logo"><img src="quetzal.svg" alt="" width="232" height="362"></div><h2>Bienvenido</h2><p>Esta app le ayuda a separar el dinero de su negocio y el de su casa, en tres sobres.</p>',
  '<p>Primer sobre</p><div class="env s-v"><span>Sobre verde</span><b>Vuelve al negocio</b><p>Para mercadería, proveedores, gasolina y los sueldos de sus trabajadores. No se toca para la casa.</p></div>',
  '<p>Segundo sobre</p><div class="env s-a"><span>Sobre amarillo</span><b>Para usted</b><p>Es su parte. De aquí sale lo de la casa: comida, luz, agua o estudios.</p></div>',
  '<p>Tercer sobre</p><div class="env s-n"><span>Sobre naranja</span><b>Apartado</b><p>Un poco cada día para pagar su préstamo y para las emergencias.</p></div>',
  '<h2>Cada noche, un minuto</h2><p>Toque los billetes que hay en la caja y la app le dice cuánto va a cada sobre. Así de fácil.</p>'
];
function renderIntro(){
  var last=intro===INTRO.length-1;
  var h=head('',intro+1,INTRO.length)+'<div class="intro">'+INTRO[intro]+'</div>';
  h+=last?'<button class="big-btn go" id="intro-mio">Empezar con mi negocio</button><button class="big-btn plain" id="intro-fin" style="margin-top:0">Ver un ejemplo primero</button>'
    :'<button class="big-btn go" id="intro-next">Siguiente</button><button class="skip" id="intro-fin">Saltar</button>';
  openSheet(h,'i'+intro);
}
function introVisto(){try{localStorage.setItem(INTRO_KEY,'1')}catch(e){}}

/* ---------- ajustes ---------- */
function apartadoTxt(c,a){var d=Math.round(c/30+a);return d>0?'Cada día la app le va a apartar <b style="display:inline">'+Q(d)+'</b> en el sobre naranja'+(c>0&&a>0?' para su préstamo y su ahorro.':c>0?' para su préstamo.':' para su ahorro.'):'No va a apartar nada por ahora. Lo puede cambiar cuando quiera.'}
function renderAjustes(nuevo){
  var s=nuevo?defaultsSetup():S.setup; if(nuevo){s.negocio='';s.cuotaMes=0;s.ahorroDia=0;s.metaUsted=0}
  var h=head(nuevo?'Su negocio':'Ajustes',0,0);
  if(nuevo) h+='<p>Solo tres datos y empieza. Se quedan guardados en este teléfono.</p>';
  h+='<div class="field"><label for="a-negocio">Nombre del negocio</label><input id="a-negocio" maxlength="40" placeholder="Ej. Tienda Don Julio" value="'+esc(s.negocio)+'"></div>';
  h+='<div class="field"><label for="a-rep">De cada Q100 que vende, ¿cuántos vuelven al negocio?</label><div class="quick">'+[40,50,60,70].map(function(v){return '<button class="choice" data-rep="'+v+'" aria-pressed="'+(+s.pctReponer===v)+'">Q'+v+'</button>'}).join('')+'</div><input id="a-rep" type="number" inputmode="numeric" min="0" max="95" value="'+s.pctReponer+'"><small>Para mercadería, proveedores y sueldos de sus trabajadores. Si no sabe, empiece con Q50.</small></div>';
  h+='<div class="field"><label for="a-cuota">¿Paga algún préstamo? ¿Cuánto al mes?</label><input id="a-cuota" type="number" inputmode="numeric" min="0" value="'+(s.cuotaMes||0)+'"><small>Ponga 0 si no tiene préstamos.</small></div>';
  h+='<div class="info n" id="a-usted">'+apartadoTxt(s.cuotaMes||0,s.ahorroDia||0)+'</div>';
  h+='<details class="more"><summary>Más opciones</summary>';
  h+='<div class="field"><label for="a-ahorro">¿Cuánto quiere ahorrar cada día?</label><input id="a-ahorro" type="number" inputmode="numeric" min="0" value="'+(s.ahorroDia||0)+'"><small>Va al sobre naranja. Puede empezar con poco, aunque sean Q5.</small></div>';
  h+='<div class="field"><label for="a-meta-u">¿Cuánto le gustaría que le quede para usted al mes?</label><input id="a-meta-u" type="number" inputmode="numeric" min="0" value="'+(s.metaUsted||0)+'"><small>Después de los gastos del negocio, el préstamo y el ahorro. Ponga 0 si no quiere meta.</small></div>';
  h+='<div class="field"><label for="a-alarma">Hora del recordatorio de cierre</label><input id="a-alarma" type="time" value="'+esc(s.alarma)+'"></div></details>';
  h+='<p class="note bad" id="a-err" hidden></p><button class="big-btn go" id="a-guardar" data-nuevo="'+(nuevo?1:0)+'">'+(nuevo?'Empezar':'Guardar')+'</button>';
  if(!nuevo){
    h+='<section class="card"><h3>Fondo de la pantalla</h3><div class="seg" style="margin-top:12px"><button data-tema="light" aria-pressed="'+(tema()==='light')+'" style="background:#FFFFFF;color:#18181B;border-color:'+(tema()==='light'?'var(--ink)':'#E3E1DA')+'">Claro</button><button data-tema="dark" aria-pressed="'+(tema()==='dark')+'" style="background:#17171A;color:#F3F2EF;border-color:'+(tema()==='dark'?'var(--ink)':'#2B2B30')+'">Oscuro</button></div></section>';
    h+='<button class="big-btn plain" id="a-intro" style="margin:0">Ver cómo funciona</button>';
    h+='<section class="card"><h3>Datos</h3><p class="note">Puede volver al negocio de ejemplo o empezar con su propio negocio desde cero.</p><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><button class="big-btn plain" style="margin:0;font-size:16px" id="a-demo">Ver el negocio de ejemplo</button><button class="big-btn plain" style="margin:0;font-size:16px" id="a-nuevo">Empezar con mi negocio</button></div></section><section class="card install"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 7v8M8.5 11.5L12 15l3.5-3.5"/></svg><div><h3>Úsela como una app</h3><p class="note">En el navegador del celular abra el menú y elija Agregar a pantalla de inicio. Funciona aunque se vaya la señal.</p></div></section>';
  }
  openSheet(h,'a');
}

/* ---------- toast ---------- */
var tt;function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true},2800)}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  if(e.target.closest('[data-help-close]')&&(e.target.hasAttribute('data-help-close')||e.target.closest('button'))){document.getElementById('help-root').innerHTML='';return}
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.help){showHelp(t.dataset.help);return}
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.id==='btn-tema'){setTema(tema()==='dark'?'light':'dark');return}
  if(t.dataset.tema){setTema(t.dataset.tema);renderAjustes(false);return}
  if(t.dataset.rep){document.getElementById('a-rep').value=t.dataset.rep;document.querySelectorAll('[data-rep]').forEach(function(x){x.setAttribute('aria-pressed',x===t)});return}
  if(t.id==='intro-next'){intro++;renderIntro();return}
  if(t.id==='intro-fin'){introVisto();closeSheet();return}
  if(t.id==='intro-mio'){introVisto();renderAjustes(true);return}
  if(t.id==='a-intro'){intro=0;renderIntro();return}
  if(t.id==='btn-saque'){renderSaque();return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.hasAttribute('data-close')){if(sheetKey.charAt(0)==='i')introVisto();closeSheet();return}
  var id=t.id;
  if(id==='btn-ajustes'){renderAjustes(false);return}
  if(id==='btn-mio'||id==='a-nuevo'){renderAjustes(true);return}
  if(id==='a-demo'){S=demoState();save();closeSheet();go('hoy');toast('Negocio de ejemplo cargado');return}
  if(id==='a-guardar'){
    var v=function(x){return document.getElementById(x).value}, nuevo=t.dataset.nuevo==='1';
    var st={negocio:v('a-negocio').trim()||'Mi negocio',pctReponer:Math.max(0,+v('a-rep')||0),cuotaMes:Math.max(0,+v('a-cuota')||0),ahorroDia:Math.max(0,+v('a-ahorro')||0),metaUsted:Math.max(0,+v('a-meta-u')||0),alarma:v('a-alarma')||'19:00'};
    if(st.pctReponer>95){var er=document.getElementById('a-err');er.textContent='Lo que vuelve al negocio no puede pasar de Q95 de cada Q100: algo tiene que quedar para usted.';er.hidden=false;return}
    if(nuevo){S={v:6,demo:false,setup:st,cierres:[],retiros:[],maxRacha:0}}else S.setup=st;
    save();closeSheet();go('hoy');toast(nuevo?'Listo. Esta noche hace su primer cierre.':'Ajustes guardados');return;
  }
  /* cierre */
  if(id==='btn-cerrar'){cierre={step:1,counts:{},typed:'',typing:false};renderCierre();return}
  if(t.dataset.den){cierre.counts[t.dataset.den]=(cierre.counts[t.dataset.den]||0)+1;renderCierre();return}
  if(t.dataset.denMinus){var d=t.dataset.denMinus;cierre.counts[d]=Math.max(0,(cierre.counts[d]||0)-1);renderCierre();return}
  if(id==='to-typed'){cierre.typing=true;cierre.counts={};renderCierre();var i=document.getElementById('typed');if(i)i.focus();return}
  if(id==='to-bills'){cierre.typing=false;cierre.typed='';renderCierre();return}
  if(id==='btn-siguiente'){var tot=cierre.typing?(+cierre.typed||0):countsTotal(cierre.counts);if(tot<=0)return;
    cierre.total=Math.round(tot);cierre.rep=repartir(cierre.total,cierre.typing?null:cierre.counts,S.setup);cierre.step=2;renderCierre();return}
  if(id==='btn-listo'){
    var before=rango(S.cierres.length);
    S.cierres=S.cierres.filter(function(c){return c.fecha!==TODAY});
    S.cierres.push({fecha:TODAY,total:cierre.total,verde:cierre.rep.verde,amarillo:cierre.rep.amarillo,naranja:cierre.rep.naranja});
    var r=racha(S);var hadReto=(S.maxRacha||0)>=7;S.maxRacha=Math.max(S.maxRacha||0,r);save();
    var after=rango(S.cierres.length);
    cierre.step=3;cierre.racha=r;cierre.frase=frase(r);cierre.subio=after>before;cierre.rango=after;cierre.reto=r>=7&&!hadReto;renderCierre();return;
  }
  /* compras y casa */
  if(id==='btn-compra'){mov={kind:'compra',counts:{},typed:'',typing:false};renderMov();return}
  if(id==='btn-casa'){mov={kind:'casa',counts:{},typed:'',typing:false,motivo:'comida',sobre:'amarillo'};renderMov();return}
  if(id==='btn-emerg'){mov={kind:'casa',emerg:true,counts:{},typed:'',typing:false,motivo:'cuota',sobre:'naranja'};renderMov();return}
  if(t.dataset.mden){mov.counts[t.dataset.mden]=(mov.counts[t.dataset.mden]||0)+1;renderMov();return}
  if(t.dataset.mdenMinus){var d2=t.dataset.mdenMinus;mov.counts[d2]=Math.max(0,(mov.counts[d2]||0)-1);renderMov();return}
  if(id==='m-to-typed'){mov.typing=true;mov.counts={};renderMov();var j=document.getElementById('m-typed');if(j)j.focus();return}
  if(id==='m-to-bills'){mov.typing=false;mov.typed='';renderMov();return}
  if(t.dataset.motivo){mov.motivo=t.dataset.motivo;renderMov();return}
  if(t.dataset.sobre){mov.sobre=t.dataset.sobre;if(t.dataset.sobre==='verde')mov.emerg=false;renderMov();return}
  if(id==='m-anotar'){var amt=Math.round(movTotal(mov));if(amt<=0)return;var msg;
    if(mov.kind==='compra'){S.retiros.push({fecha:TODAY,monto:amt,tipo:'compra',motivo:null,sobre:'verde'});save();closeSheet();msg='Gasto anotado. Al sobre verde le quedan '+Q(balances(S).verde)+'.'}
    else if(mov.sobre==='verde'){S.retiros.push({fecha:TODAY,monto:amt,tipo:'prestamo',motivo:mov.motivo,sobre:'verde',devuelto:null,pagos:[]});save();closeSheet();msg='Préstamo anotado. Cuando lo reponga, toque Devolví.'}
    else {var so=mov.sobre;S.retiros.push({fecha:TODAY,monto:amt,tipo:'casa',motivo:mov.motivo,sobre:so});save();closeSheet();msg=so==='naranja'?'Anotado. A su apartado le quedan '+Q(balances(S).naranja)+'.':'Anotado. A su parte le quedan '+Q(balances(S)[so])+'.'}
    toast(msg);return}
  /* devolver */
  if(id==='btn-devolver'){renderDevolver();return}
  if(t.dataset.devolver){var k=+t.dataset.devolver,r0=S.retiros[k],inp=document.getElementById('dev-'+k);if(!r0)return;var val=+(inp&&inp.value)||0;
    if(val<=0){toast('Escriba cuánto devolvió.');return}
    var pagadoAhora=pagar(r0,val);save();
    if(deuda(S)>0){renderDevolver();toast('Devolvió '+Q(pagadoAhora)+'. Todavía debe '+Q(deuda(S))+'.')}else{closeSheet();toast('Devolvió '+Q(pagadoAhora)+'. Su pronóstico quedó limpio.')}return}
  if(id==='dev-todo'){pendientes(S).forEach(function(r){pagar(r,resta(r))});save();closeSheet();toast('Devuelto. Su pronóstico quedó limpio.');return}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='a-rep'){document.querySelectorAll('[data-rep]').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.rep===t.value)});return}
  if(t.id==='a-cuota'||t.id==='a-ahorro'){document.getElementById('a-usted').innerHTML=apartadoTxt(+document.getElementById('a-cuota').value||0,+document.getElementById('a-ahorro').value||0);return}
  if(t.id==='typed'){cierre.typed=t.value;var tot=+t.value||0;document.getElementById('cierre-total').textContent=Q(tot);document.getElementById('btn-siguiente').disabled=!(tot>0);return}
  if(t.id==='m-typed'){mov.typed=t.value;var pos=t.selectionStart;renderMov();var n=document.getElementById('m-typed');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}
});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;var hr=document.getElementById('help-root');if(hr.innerHTML){hr.innerHTML='';return}if(root.innerHTML)closeSheet()});
var hash=(location.hash||'').slice(1); if(['hoy','sobres','pronostico','puesto'].indexOf(hash)>-1)ui.tab=hash;
render();
var vio=null;try{vio=localStorage.getItem(INTRO_KEY)}catch(e){vio='1'}
if(!vio){intro=0;renderIntro()}
